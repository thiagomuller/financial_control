<div class="auth-wrap">
  <div class="card auth-card">
    <h1>My Finances</h1>
    <p class="subtitle">Create your account</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" formControlName="name" type="text" placeholder="John Doe" />
        <span class="error-msg" *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
          >Name must be at least 2 characters</span
        >
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" formControlName="username" type="text" placeholder="john_doe" />
        <span
          class="error-msg"
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
          >Username must be at least 3 characters</span
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" placeholder="john@example.com" />
        <span class="error-msg" *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
          >Valid email is required</span
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" formControlName="password" type="password" placeholder="••••••••" />
        <span
          class="error-msg"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          >Password must be at least 6 characters</span
        >
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input
          id="confirm"
          formControlName="confirmPassword"
          type="password"
          placeholder="••••••••"
        />
        <span
          class="error-msg"
          *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched"
          >Passwords do not match</span
        >
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button class="btn btn-primary w-full" type="submit" [disabled]="loading">
        {{ loading ? 'Creating account…' : 'Create Account' }}
      </button>
    </form>

    <p class="footer-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
