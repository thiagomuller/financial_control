<div class="page-header">
  <h1>Incomes</h1>
  <button class="btn btn-primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : '+ New Income' }}</button>
</div>
<div class="card form-card" *ngIf="showForm">
  <form [formGroup]="form" (ngSubmit)="create()">
    <div class="form-row">
      <div class="form-group"><label>Name</label><input formControlName="name" placeholder="e.g. Salary"></div>
      <div class="form-group"><label>Value</label><input formControlName="value" type="number" step="0.01"></div>
      <div class="form-group"><label>Day of month</label><input formControlName="repeatable_day" type="number" min="1" max="31"></div>
    </div>
    <div class="form-group">
      <label>Account</label>
      <select formControlName="bank_account_id">
        <option value="">Select account</option>
        <option *ngFor="let a of accounts" [value]="a.id">{{ a.name }}</option>
      </select>
    </div>
    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Create</button>
  </form>
</div>
<div *ngIf="loading" class="spinner"></div>
<div *ngIf="!loading" class="card">
  <div class="empty-state" *ngIf="incomes.length === 0"><p>No incomes yet.</p></div>
  <table *ngIf="incomes.length > 0">
    <thead><tr><th>Name</th><th>Value</th><th>Day</th><th>Account</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let i of incomes">
        <td>{{ i.name }}</td>
        <td class="amount-add">+{{ i.value | currency:'BRL':'symbol':'1.2-2' }}</td>
        <td>{{ i.repeatable_day }}</td>
        <td>{{ accountName(i.bank_account_id) }}</td>
        <td><button class="btn btn-danger btn-sm" (click)="delete(i.id)">Delete</button></td>
      </tr>
    </tbody>
  </table>
</div>
