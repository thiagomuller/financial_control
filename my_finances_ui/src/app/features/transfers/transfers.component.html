<div class="page-header">
  <h1>Transfers</h1>
  <button class="btn btn-primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : '+ New Transfer' }}</button>
</div>

<div class="card form-card" *ngIf="showForm">
  <form [formGroup]="form" (ngSubmit)="create()">
    <div class="form-row">
      <div class="form-group"><label>Name</label><input formControlName="name" placeholder="e.g. Savings transfer"></div>
      <div class="form-group"><label>Amount</label><input formControlName="value" type="number" step="0.01"></div>
      <div class="form-group"><label>Date</label><input formControlName="date" type="date"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>From Account</label>
        <select formControlName="source_account_id">
          <option value="">Select source</option>
          <option *ngFor="let a of accounts" [value]="a.id">{{ a.name }} ({{ a.balance | currency:'BRL':'symbol':'1.2-2' }})</option>
        </select>
      </div>
      <div class="form-group">
        <label>To Account</label>
        <select formControlName="target_account_id">
          <option value="">Select target</option>
          <option *ngFor="let a of accounts" [value]="a.id">{{ a.name }}</option>
        </select>
      </div>
    </div>
    <div class="error-msg" *ngIf="error">{{ error }}</div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Transfer</button>
  </form>
</div>

<div *ngIf="loading" class="spinner"></div>
<div *ngIf="!loading" class="card">
  <div class="empty-state" *ngIf="result.data.length === 0"><p>No transfers yet.</p></div>
  <table *ngIf="result.data.length > 0">
    <thead><tr><th>Date</th><th>Name</th><th>From</th><th>To</th><th>Amount</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let t of result.data">
        <td>{{ t.date | date:'MMM d, y' }}</td>
        <td>{{ t.name }}</td>
        <td>{{ accountName(t.source_account_id) }}</td>
        <td>{{ accountName(t.target_account_id) }}</td>
        <td class="amount-subtract">{{ t.value | currency:'BRL':'symbol':'1.2-2' }}</td>
        <td><button class="btn btn-danger btn-sm" (click)="delete(t.id)">Delete</button></td>
      </tr>
    </tbody>
  </table>
  <div class="pagination" *ngIf="result.pages > 1">
    <button [disabled]="page===1" (click)="goToPage(page-1)">‹</button>
    <button *ngFor="let p of pageNumbers()" [class.active]="p===page" (click)="goToPage(p)">{{ p }}</button>
    <button [disabled]="page===result.pages" (click)="goToPage(page+1)">›</button>
  </div>
</div>
